name: Update item database

on:
  schedule:
    # 03:17 KST every day. The odd minute avoids the busiest hourly boundary.
    - cron: '17 18 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-item-database
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Regenerate item data
        run: npm run data:update

      - name: Validate generated data
        run: npm run data:validate

      - name: Commit changed data
        shell: bash
        run: |
          if git diff --quiet -- src/data/items.json src/data/masterItems.json src/data/searchItems.json; then
            echo "Item data is already up to date."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- src/data/items.json src/data/masterItems.json src/data/searchItems.json
          git commit -m "chore(data): update market items"
          git push
