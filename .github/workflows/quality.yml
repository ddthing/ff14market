name: Application quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run data:validate
      - run: npm run build
      - run: npx tsc -p tsconfig.worker.json
      - run: npx --yes wrangler@4.151.0 deploy --config wrangler.market-sync.toml --dry-run --outdir ../market-sync-build
