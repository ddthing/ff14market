name = "ff14market-market-sync"
main = "workers/market-sync.ts"
compatibility_date = "2026-08-20"
workers_dev = false

[vars]
MARKET_API_BASE_URL = "https://ff14market.pages.dev"

[triggers]
crons = ["*/5 * * * *"]

[[r2_buckets]]
binding = "MARKET_SNAPSHOTS"
bucket_name = "ff14market-market-snapshots"
